<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1430"/><stop offset="1" stop-color="#16285a"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" opacity="0.07"/>
    </pattern>
    <linearGradient id="line" x1="0" x2="1"><stop offset="0" stop-color="#ffc72c"/><stop offset="1" stop-color="#ffc72c" stop-opacity="0.35"/></linearGradient>
  </defs>
  <rect width="1280" height="400" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="400" rx="24" fill="url(#dots)"/>
  <!-- wordmark -->
  <g transform="translate(72 118)">
    <rect x="0" y="-46" width="56" height="56" rx="12" fill="#ffc72c"/>
    <path d="M14 -18 h22 m-8 -10 10 10 -10 10" fill="none" stroke="#0a1430" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="76" y="0" font-size="58" font-weight="800" fill="#ffffff" letter-spacing="-1">Deeplinker</text>
  </g>
  <text x="72" y="178" font-size="25" fill="#c3cde6">Turn any page on your site into a deep link.</text>
  <text x="72" y="212" font-size="25" fill="#c3cde6">One URL, the right place on every device.</text>
  <!-- the link -->
  <g transform="translate(72 262)">
    <rect width="452" height="64" rx="32" fill="#1d3170" stroke="#2f4a96"/>
    <circle cx="32" cy="32" r="8" fill="#3ddc97"/>
    <text x="54" y="41" font-size="22" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">https://your.site/property/42</text>
  </g>
  <!-- branches -->
  <g fill="none" stroke="url(#line)" stroke-width="3">
    <path d="M524 294 C 640 294, 640 92, 760 92"/>
    <path d="M524 294 C 640 294, 640 174, 760 174"/>
    <path d="M524 294 C 640 294, 640 256, 760 256"/>
    <path d="M524 294 C 640 294, 640 338, 760 338"/>
  </g>
  <circle cx="524" cy="294" r="7" fill="#ffc72c"/>
  <!-- destinations -->
  <g font-size="20" fill="#ffffff">
    <g transform="translate(760 64)">
      <rect width="440" height="56" rx="14" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.14"/>
      <rect x="18" y="12" width="20" height="32" rx="5" fill="none" stroke="#ffc72c" stroke-width="3"/>
      <text x="56" y="26" font-size="20" font-weight="600">Opens your app</text>
      <text x="56" y="46" font-size="15" fill="#8fa0c8">iOS · Android · macOS · Windows</text>
    </g>
    <g transform="translate(760 146)">
      <rect width="440" height="56" rx="14" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.14"/>
      <path d="M18 22 h22 l-3 20 h-16 z M23 22 v-4 a6 6 0 0 1 12 0 v4" fill="none" stroke="#ffc72c" stroke-width="3" stroke-linejoin="round"/>
      <text x="56" y="26" font-size="20" font-weight="600">The right app store</text>
      <text x="56" y="46" font-size="15" fill="#8fa0c8">App Store · Play · Galaxy · AppGallery</text>
    </g>
    <g transform="translate(760 228)">
      <rect width="440" height="56" rx="14" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.14"/>
      <rect x="16" y="14" width="26" height="28" rx="4" fill="none" stroke="#ffc72c" stroke-width="3"/><path d="M16 22 h26" stroke="#ffc72c" stroke-width="3"/>
      <text x="56" y="26" font-size="20" font-weight="600">Your web app</text>
      <text x="56" y="46" font-size="15" fill="#8fa0c8">path, query and hash kept</text>
    </g>
    <g transform="translate(760 310)">
      <rect width="440" height="56" rx="14" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.14"/>
      <path d="M20 14 h16 l6 6 v22 h-22 z" fill="none" stroke="#ffc72c" stroke-width="3" stroke-linejoin="round"/>
      <text x="56" y="26" font-size="20" font-weight="600">Or stays on the page</text>
      <text x="56" y="46" font-size="15" fill="#8fa0c8">never guesses</text>
    </g>
  </g>
</svg>
