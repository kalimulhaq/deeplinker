name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs all of this first, so nothing is published unless every check passes.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types, tests, build, size
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      # The build includes the runtime's size gate: it fails when the browser script is over 6 KB min+gzip.
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test

  examples:
    name: Examples end to end
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm e2e:examples

  browsers:
    name: Browser tests (${{ matrix.project }})
    runs-on: ubuntu-latest
    needs: check
    strategy:
      fail-fast: false
      matrix:
        project: [chromium-android, webkit-iphone, firefox-desktop]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps ${{ matrix.project == 'chromium-android' && 'chromium' || matrix.project == 'webkit-iphone' && 'webkit' || 'firefox' }}
      - run: pnpm test:browser --project=${{ matrix.project }}
