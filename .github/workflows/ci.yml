name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs all of this first, so nothing is published unless every check passes.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types, tests, build, size
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      # The build includes the runtime's size gate: it fails when the browser script is over 6 KB min+gzip.
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test

  examples:
    name: Examples end to end
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: check
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm e2e:examples

  browsers:
    name: Browser tests (${{ matrix.project }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: check
    # Playwright's own image has every browser and the system libraries they need already installed, so nothing is
    # downloaded from the Ubuntu package mirror (which can take longer than the tests). Keep its tag equal to the
    # @playwright/test version in pnpm-lock.yaml: a mismatch fails with "Executable doesn't exist".
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    env:
      # Firefox will not start when $HOME belongs to another user; in the container we run as root.
      HOME: /root
    strategy:
      fail-fast: false
      matrix:
        project: [chromium-android, webkit-iphone, firefox-desktop]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:browser --project=${{ matrix.project }}
