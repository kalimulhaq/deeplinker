name: Release

# Push a tag like v0.2.0 to release. Before anything is published: every CI check passes, the tag matches the version
# in packages/deeplinker/package.json, and CHANGELOG.md has a dated section for it, which becomes the release notes.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  npm:
    name: Publish @kalimulhaq/deeplinker to npm
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # npm trusted publishing: npm checks this workflow's identity instead of a stored token, and adds provenance.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@^11.5.1
      - run: node scripts/release-notes.mjs "$GITHUB_REF_NAME" > /dev/null
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Publish, unless this version is already on npm
        working-directory: packages/deeplinker
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@kalimulhaq/deeplinker@$VERSION" version > /dev/null 2>&1; then
            echo "@kalimulhaq/deeplinker@$VERSION is already on npm; nothing to publish."
          else
            npm publish --access public
          fi

  github:
    name: GitHub Release
    needs: npm
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/release-notes.mjs "$GITHUB_REF_NAME" RELEASE_NOTES.md
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md

  pages:
    name: Web generator on GitHub Pages
    needs: npm
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web-generator/dist
      - id: deploy
        uses: actions/deploy-pages@v4
