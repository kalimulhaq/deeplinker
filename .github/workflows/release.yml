name: Release

# Push a tag like v0.2.0 to release. Before anything is published: every CI check passes, the tag matches the version
# in packages/deeplinker/package.json, and CHANGELOG.md has a dated section for it, which becomes the release notes.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  npm:
    name: Stage @kalimulhaq/deeplinker on npm
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # npm trusted publishing: npm checks this workflow's identity instead of a stored token, and adds provenance.
      # The package allows this workflow to stage a release only; a maintainer approves it on npm with 2FA.
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # Staged publishing needs npm 11.15.0 or newer.
      - run: npm install -g npm@^11.15.0
      - run: node scripts/release-notes.mjs "$GITHUB_REF_NAME" > /dev/null
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Stage for approval, unless this version is already on npm
        working-directory: packages/deeplinker
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@kalimulhaq/deeplinker@$VERSION" version > /dev/null 2>&1; then
            echo "@kalimulhaq/deeplinker@$VERSION is already on npm; nothing to publish."
          else
            npm stage publish --access public
            echo "::notice::@kalimulhaq/deeplinker@$VERSION is staged. Approve it on npmjs.com (Staged Packages) or with: npm stage list, then npm stage approve <id>"
          fi

  github:
    name: GitHub Release
    needs: npm
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - run: node scripts/release-notes.mjs "$GITHUB_REF_NAME" RELEASE_NOTES.md
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md

  pages:
    name: Web generator on GitHub Pages
    needs: npm
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web-generator/dist
      - id: deploy
        uses: actions/deploy-pages@v5
